name: OSV Scanner - Scheduled

on:
  push:
    branches: [main]

  schedule:
    - cron: '30 5 * * 1'

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Full dependency scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
