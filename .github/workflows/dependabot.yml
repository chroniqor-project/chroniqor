version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    labels:
      - dependencies

    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    labels:
      - dependencies
      - ci

    commit-message:
      prefix: ci
      include: scope
