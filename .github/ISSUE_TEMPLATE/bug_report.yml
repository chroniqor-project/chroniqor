name: Bug report
description: Report a reproducible problem in Chroniqor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chroniqor.

        Please provide enough information to reproduce the problem.
        Chroniqor is currently experimental software and is not intended
        for live or real-money trading.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what went wrong.
      placeholder: Explain the observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence possible.
      placeholder: |
        1. Create...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Chroniqor version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected area
      options:
        - chroniqor-core
        - chroniqor-runtime
        - build / CI
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste relevant stack traces, test failures, or command output.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Java:
        Gradle:
        Docker:
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, credentials, tokens, and private data from the report.
          required: true
