name: Feature request
description: Propose a new capability or improvement for Chroniqor
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose functionality or architectural improvements.

        Please keep proposals aligned with Chroniqor's scope as a deterministic
        algorithmic trading simulation engine.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior or design.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - instrument
        - market
        - dataset
        - strategy
        - replay
        - audit
        - order
        - risk
        - simulation / execution
        - portfolio
        - metrics
        - runtime / infrastructure
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Architectural considerations
      description: |
        Describe relevant module boundaries, determinism requirements,
        compatibility concerns, or dependencies.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives if applicable.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for similar proposals.
          required: true
        - label: This proposal does not introduce live or real-money trading into the current V0.1 scope.
          required: true
