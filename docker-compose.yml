name: chroniqor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      CHRONIQOR_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chroniqor}
      CHRONIQOR_DB_USERNAME: ${POSTGRES_USER:-chroniqor}
      CHRONIQOR_DB_PASSWORD: ${POSTGRES_PASSWORD:-chroniqor_dev}

    ports:
      - "${SERVER_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chroniqor}
      POSTGRES_USER: ${POSTGRES_USER:-chroniqor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chroniqor_dev}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - chroniqor-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chroniqor -d chroniqor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chroniqor-postgres-data:
